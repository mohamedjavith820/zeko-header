<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zeko Consult &amp; Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --ink:#100E0B;
    --paper:#EAE3D2;
    --stone:#8A8071;
    --brass:#8C6A32;
    --brass-light:#C9A155;
    --brass-deep:#4A3718;
    --line: rgba(234,227,210,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overflow:hidden;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  canvas#scene{
    position:fixed;
    inset:0;
    z-index:0;
    display:block;
  }

  .grid-bg{
    position:fixed;
    inset:0;
    z-index:1;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 78% 70% at 50% 45%, black 5%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 78% 70% at 50% 45%, black 5%, transparent 78%);
    pointer-events:none;
  }

  .vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(0,0,0,0.6) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(0,0,0,0.4) 0%, transparent 65%),
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(176,138,62,0.06) 0%, transparent 70%);
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .glow{
    position:fixed;
    top:48%; left:50%;
    width: clamp(280px, 42vh, 540px);
    height: clamp(280px, 42vh, 540px);
    transform:translate(calc(-50% + var(--gx, 0px)), calc(-50% + var(--gy, 0px)));
    background: radial-gradient(circle, rgba(201,161,85,0.12) 0%, rgba(201,161,85,0) 70%);
    pointer-events:none;
    z-index:2;
  }

  .frame{
    position:relative;
    z-index:3;
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:1280px;
    width:100%;
    margin:0 auto;
    padding: clamp(16px,3vh,32px) clamp(20px,4vw,48px);
    min-height:0;
  }

  .frame > *{ opacity:0; }
  header{ animation: riseIn 1s cubic-bezier(.19,1,.22,1) 0.15s forwards; }
  main{ animation: riseIn 1.1s cubic-bezier(.19,1,.22,1) 0.4s forwards; }
  footer{ animation: riseIn 1s cubic-bezier(.19,1,.22,1) 0.85s forwards; }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  canvas#scene{ opacity:0; animation: fadeCanvas 2.4s ease 0.1s forwards; }
  @keyframes fadeCanvas{ from{opacity:0;} to{opacity:1;} }

  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }
  .mark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .mark img{
    width:clamp(30px,3.4vh,40px);
    height:clamp(30px,3.4vh,40px);
    border-radius:50%;
    display:block;
    filter: drop-shadow(0 0 14px rgba(176,138,62,0.35));
  }
  .mark-text{
    display:flex;
    flex-direction:column;
    line-height:1.12;
  }
  .mark-text .co{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:15.5px;
    letter-spacing:0.015em;
    background: linear-gradient(120deg, var(--paper) 30%, var(--brass-light) 65%, var(--paper) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .mark-text .sub{
    font-size:9.5px;
    color:var(--stone);
    letter-spacing:0.12em;
  }

  main{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }

  .hero-copy{
    flex:0 0 auto;
    max-width: 640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(14px, 2vh, 22px);
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size: clamp(48px, 10vh, 118px);
    line-height:1.04;
    letter-spacing:-0.005em;
    max-width:16ch;
    color: var(--paper);
    background: linear-gradient(180deg, #FFFAEE 0%, #FFF3D6 22%, #F0CE85 46%, #D9A94A 72%, #B8862E 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    /* flat -- no rotation/perspective on the glyphs, so edges stay crisp and hinted */
    text-shadow:
      1px 1px 0 #DCB264,
      2px 2px 0 #C99B50,
      3px 3px 0 #B4863F,
      4px 4px 0 #9C7132,
      5px 5px 0 #835C27,
      6px 6px 2px rgba(0,0,0,0.25);
  }
  h1 .uc{
    display:inline-block;
    margin-top: 0.2em;
    font-size: 0.3em;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color: var(--brass-light);
    text-shadow:none;
    position:relative;
    padding-bottom: 0.5em;
  }
  h1 .uc::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:0;
    width:2.4em;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--brass-light), transparent);
    transform: translateX(-50%);
  }
  @keyframes shimmer{
    0%{ background-position: 200% 0; }
    100%{ background-position: -40% 0; }
  }

  .lede{
    max-width:44ch;
    font-size: clamp(13px, 1.7vh, 16.5px);
    line-height:1.6;
    color:#C9C4B8;
  }

  .cta-row{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: clamp(16px,2.4vw,26px);
    margin-top: clamp(6px,1.2vh,10px);
  }
  .btn-primary{
    background:var(--brass);
    color:#151515;
    text-decoration:none;
    font-size: clamp(12.5px,1.5vh,14.5px);
    font-weight:500;
    padding: clamp(9px,1.4vh,13px) clamp(18px,2vw,24px);
    border-radius:2px;
    transition:background .2s ease, transform .2s ease;
    box-shadow: 0 10px 30px -10px rgba(176,138,62,0.55);
  }
  .btn-primary:hover{background:var(--brass-light); transform:translateY(-2px);}
  .btn-ghost{
    color:var(--paper);
    text-decoration:none;
    font-size: clamp(12.5px,1.5vh,14.5px);
    border-bottom:1px solid var(--stone);
    padding-bottom:2px;
    transition:border-color .2s ease, color .2s ease;
  }
  .btn-ghost:hover{border-color:var(--brass-light); color:var(--brass-light);}

  footer{
    flex:0 0 auto;
    border-top:1px solid var(--line);
    padding-top: clamp(10px,1.6vh,16px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(9.5px,1.2vh,11.5px);
    color:var(--stone);
    letter-spacing:0.03em;
  }
  footer .block{ display:flex; gap:clamp(16px,2.4vw,30px); }
  footer a{ color:var(--brass-light); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  @media (max-width: 760px){
    main{ flex-direction:column; text-align:center; justify-content:center; gap:18px; }
    .hero-copy{ align-items:center; max-width:100%; }
    h1{ max-width:16ch; }
    .glow{ left:50%; transform:translate(-50%,-50%); }
    footer{ flex-direction:column; align-items:flex-start; gap:6px; }
    footer .block{ gap:16px; }
  }
</style>
</head>

<script>
(function(){
  var canvas = document.getElementById('scene');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x111214, 0.045);
  var camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 3.4, 17.5);
  camera.lookAt(0,1.9,0);

  var group = new THREE.Group();
  scene.add(group);

  // gold wireframe skyline: stacked boxes of varying height, edges only
  var brass = new THREE.Color(0x8C6A32);
  var brassBright = new THREE.Color(0xC9A155);
  var stone = new THREE.Color(0x5c584c);

  var towers = [
    { w:1.1, h:3.0, d:1.1, x:-4.6, color: brass, op:0.55, phase:0.2 },
    { w:1.3, h:4.6, d:1.3, x:-3.0, color: brass, op:0.6, phase:1.4 },
    { w:1.5, h:6.4, d:1.5, x:-1.2, color: brassBright, op:0.68, phase:2.6 },
    { w:1.7, h:8.6, d:1.7, x: 0.8, color: brassBright, op:0.92, phase:0.7 },
    { w:1.4, h:5.6, d:1.4, x: 2.8, color: brass, op:0.55, phase:3.3 },
    { w:1.1, h:3.6, d:1.1, x: 4.4, color: stone, op:0.34, phase:4.1 }
  ];

  var towerMeshes = [];

  towers.forEach(function(t){
    var geo = new THREE.BoxGeometry(t.w, t.h, t.d);
    var edges = new THREE.EdgesGeometry(geo);
    var mat = new THREE.LineBasicMaterial({ color: t.color, transparent:true, opacity:t.op });
    var mesh = new THREE.LineSegments(edges, mat);
    var baseY = t.h/2 - 2.2;
    mesh.position.set(t.x, baseY, 0);
    mesh.userData = { baseY: baseY, baseX: t.x, phase: t.phase, h: t.h };
    group.add(mesh);
    towerMeshes.push(mesh);

    // subtle internal floor lines on brighter towers for structural detail
    if(t.op > 0.6){
      var floors = Math.floor(t.h / 0.55);
      var floorMat = new THREE.LineBasicMaterial({ color: brassBright, transparent:true, opacity:0.28 });
      var pts = [];
      for(var i=1;i<floors;i++){
        var y = -t.h/2 + i*0.55;
        pts.push(new THREE.Vector3(-t.w/2, y, t.d/2));
        pts.push(new THREE.Vector3(t.w/2, y, t.d/2));
      }
      var floorGeo = new THREE.BufferGeometry().setFromPoints(pts);
      var floorLines = new THREE.LineSegments(floorGeo, floorMat);
      mesh.add(floorLines);
    }
  });

  // construction crane silhouette -- thin wireframe, low opacity, slow independent rotation
  var craneMat = new THREE.LineBasicMaterial({ color: stone, transparent:true, opacity:0.32 });
  var craneGroup = new THREE.Group();
  var craneX = -6.4;
  var mastHeight = 9.6;

  var mastGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.16, mastHeight, 0.16));
  var mast = new THREE.LineSegments(mastGeo, craneMat);
  mast.position.set(craneX, -2.2 + mastHeight/2, 0);
  craneGroup.add(mast);

  var craneArm = new THREE.Group();
  craneArm.position.set(craneX, -2.2 + mastHeight, 0);

  var jibGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(6.2, 0.13, 0.13));
  var jib = new THREE.LineSegments(jibGeo, craneMat);
  jib.position.set(3.1, 0, 0);
  craneArm.add(jib);

  var counterJibGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.7, 0.13, 0.13));
  var counterJib = new THREE.LineSegments(counterJibGeo, craneMat);
  counterJib.position.set(-0.85, 0, 0);
  craneArm.add(counterJib);

  var counterweightGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.5, 0.4, 0.4));
  var counterweight = new THREE.LineSegments(counterweightGeo, craneMat);
  counterweight.position.set(-1.5, -0.25, 0);
  craneArm.add(counterweight);

  var hookPts = [
    new THREE.Vector3(4.6, 0, 0),
    new THREE.Vector3(4.6, -1.6, 0)
  ];
  var hookGeo = new THREE.BufferGeometry().setFromPoints(hookPts);
  var hookLine = new THREE.LineSegments(hookGeo, craneMat);
  craneArm.add(hookLine);

  craneGroup.add(craneArm);
  group.add(craneGroup);

  // ground plane grid
  var gridHelper = new THREE.GridHelper(20, 24, 0x6d6a60, 0x33312c);
  gridHelper.position.y = -2.2;
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = 0.18;
  scene.add(gridHelper);

  // drifting dust / atmosphere particles, gives the scene depth and life
  var dustCount = 220;
  var dustGeo = new THREE.BufferGeometry();
  var dustPos = new Float32Array(dustCount * 3);
  var dustSpeed = new Float32Array(dustCount);
  for(var i=0;i<dustCount;i++){
    dustPos[i*3]   = (Math.random()-0.5) * 22;
    dustPos[i*3+1] = Math.random() * 10 - 2.2;
    dustPos[i*3+2] = (Math.random()-0.5) * 16;
    dustSpeed[i] = 0.025 + Math.random()*0.045;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  var dustMat = new THREE.PointsMaterial({
    color: 0xC9A155,
    size: 0.045,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite:false
  });
  var dust = new THREE.Points(dustGeo, dustMat);
  scene.add(dust);

  group.rotation.y = -0.35;

  var mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
  window.addEventListener('mousemove', function(e){
    targetMouseX = (e.clientX / window.innerWidth - 0.5);
    targetMouseY = (e.clientY / window.innerHeight - 0.5);
  });

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  var clock = new THREE.Clock();
  var dustArr = dustGeo.attributes.position.array;
  var glowEl = document.getElementById('glow');
  var glowMaxOffset = 70; // px, keeps the drift subtle

  function animate(){
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    // ease the mouse influence for a slower, weightier feel
    mouseX += (targetMouseX - mouseX) * 0.012;
    mouseY += (targetMouseY - mouseY) * 0.012;

    if(glowEl){
      glowEl.style.setProperty('--gx', (mouseX * glowMaxOffset).toFixed(1) + 'px');
      glowEl.style.setProperty('--gy', (mouseY * glowMaxOffset).toFixed(1) + 'px');
    }

    group.rotation.y = -0.35 + Math.sin(t*0.03) * 0.07 + mouseX * 0.09;
    group.rotation.x = mouseY * 0.02;

    // each tower slowly rises and grows from ground level, then eases back down, on its own staggered cycle -- a slow "under construction" rhythm
    // on page load, towers also rise from nothing in sequence (a one-time construction-style entrance) before settling into that cycle
    var entranceDuration = 2.2;
    for(var m=0;m<towerMeshes.length;m++){
      var mesh = towerMeshes[m];
      var d = mesh.userData;
      var localT = Math.max(0, t - m*0.12);
      var entrance = Math.min(1, localT / entranceDuration);
      entrance = entrance*entrance*(3 - 2*entrance); // smoothstep ease
      var growth = (0.35 + 0.65 * (0.5 + 0.5*Math.sin(t*0.045 + d.phase))) * entrance;
      mesh.scale.y = growth;
      mesh.position.y = -2.2 + (d.h * growth) / 2;
      mesh.rotation.y = Math.sin(t*0.025 + d.phase) * 0.1;
    }

    // crane arm swings slowly and independently, like a working crane idling
    craneArm.rotation.y = t * 0.045;

    camera.position.x += (mouseX*0.9 - camera.position.x) * 0.01;
    camera.position.y = 3.4 + Math.sin(t*0.02) * 0.12;
    camera.lookAt(0,1.9,0);

    for(var i=0;i<dustCount;i++){
      dustArr[i*3+1] += dustSpeed[i] * 0.006;
      if(dustArr[i*3+1] > 8) dustArr[i*3+1] = -2.2;
    }
    dustGeo.attributes.position.needsUpdate = true;
    dust.rotation.y += 0.0006;

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
